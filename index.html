<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RaspyJack Remote</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }
    body { background: radial-gradient(1200px 800px at 50% -10%, #1e1610 0%, #131316 55%, #0e0e10 100%); color: #e6dfd7; }
    .ember { box-shadow: 0 0 0 1px rgba(224,122,47,.25), 0 0 24px rgba(224,122,47,.10) inset, 0 18px 38px rgba(0,0,0,.55); }
    .ember-btn { box-shadow: 0 0 0 1px rgba(184,94,36,.32), 0 4px 10px rgba(0,0,0,.35); }
    .ember-btn:active, .ember-btn.active { filter: brightness(1.15); transform: translateY(1px); }
    button:focus-visible { outline: 2px solid #e07a2f; outline-offset: 2px; }
  </style>
</head>
<body class="min-h-screen text-[#e6dfd7]">
  <div class="mx-auto max-w-4xl px-4 py-6">
    <div class="flex items-center justify-center mb-6 select-none">
      <div class="flex flex-row md:flex-col items-center justify-center gap-3 flex-nowrap">
        <img src="./raspyjack.png" alt="RaspyJack" class="order-1 md:order-2 h-12 md:h-24 drop-shadow-[0_0_18px_rgba(224,122,47,0.28)]"/>
        <div class="order-2 md:order-1 text-center">
          <div class="text-4xl md:text-5xl font-black tracking-wide"><span class="text-[#f2994a]">R</span>ASPY<span class="text-[#e07a2f]">J</span>ACK</div>
          <div class="mt-1 text-xs md:text-sm text-[#9b928a]">Remote Control Interface</div>
        </div>
      </div>
    </div>

    <!-- Device card -->
    <div class="ember rounded-3xl ring-1 ring-[#b85e24]/40 bg-gradient-to-br from-[#1b1a1e] to-[#121215] backdrop-blur-md p-4 md:p-5 w-fit mx-auto">
      <!-- Mobile: 2 columns (screen spans 2) → row below has pad (left) and keys (right)
           Desktop: 3 columns (pad | screen | keys) -->
      <div class="grid grid-cols-[140px_140px] md:grid-cols-[120px_auto_120px] gap-3 md:gap-4 justify-items-center items-center">
        <!-- Left pad -->
        <div class="order-2 md:order-1 flex md:block justify-center justify-self-start">
          <div class="grid grid-cols-3 grid-rows-3 gap-1.5 w-[120px]">
            <div></div>
            <button class="ember-btn rounded-xl bg-[#1f1e22] hover:bg-[#2d1d12] w-10 h-10 flex items-center justify-center ring-1 ring-[#b85e24]/30 hover:ring-[#e07a2f] transition" data-btn="UP">▲</button>
            <div></div>
            <button class="ember-btn rounded-xl bg-[#1f1e22] hover:bg-[#2d1d12] w-10 h-10 flex items-center justify-center ring-1 ring-[#b85e24]/30 hover:ring-[#e07a2f] transition" data-btn="LEFT">◄</button>
            <button class="ember-btn rounded-xl bg-[#e07a2f] hover:bg-[#f2994a] text-[#120c08] font-bold w-10 h-10 flex items-center justify-center ring-1 ring-[#f2994a]/60 transition" data-btn="OK" aria-label="OK">●</button>
            <button class="ember-btn rounded-xl bg-[#1f1e22] hover:bg-[#2d1d12] w-10 h-10 flex items-center justify-center ring-1 ring-[#b85e24]/30 hover:ring-[#e07a2f] transition" data-btn="RIGHT">►</button>
            <div></div>
            <button class="ember-btn rounded-xl bg-[#1f1e22] hover:bg-[#2d1d12] w-10 h-10 flex items-center justify-center ring-1 ring-[#b85e24]/30 hover:ring-[#e07a2f] transition" data-btn="DOWN">▼</button>
            <div></div>
          </div>
        </div>

        <!-- Screen -->
        <div class="order-1 md:order-2 col-span-2 md:col-span-1">
          <div class="rounded-2xl ring-1 ring-[#e07a2f]/40 bg-[#0b0b0d] p-2 shadow-[0_0_28px_rgba(224,122,47,0.14)]">
            <div class="flex items-center justify-center">
              <canvas id="screen" width="128" height="128" class="w-[240px] md:w-[300px] aspect-square"></canvas>
            </div>
          </div>
          <div class="mt-3 text-center text-xs text-[#9b928a]">Keyboard: ← ↑ → ↓, Enter=OK, 1/2/3=KEY1/KEY2/KEY3, Esc=KEY3</div>
          <div id="status" class="mt-1 text-center text-[11px] text-[#6b645e]">Connecting…</div>
        </div>

        <!-- Right buttons -->
        <div class="order-3 md:order-3 flex flex-col items-center gap-2 md:items-stretch justify-self-end">
          <button class="ember-btn rounded-xl bg-[#241913] hover:bg-[#332016] text-[#f2994a] font-semibold px-3 py-2 w-24 ring-1 ring-[#e07a2f]/35 transition" data-btn="KEY1">KEY1</button>
          <button class="ember-btn rounded-xl bg-[#241913] hover:bg-[#332016] text-[#f2994a] font-semibold px-3 py-2 w-24 ring-1 ring-[#e07a2f]/35 transition" data-btn="KEY2">KEY2</button>
          <button class="ember-btn rounded-xl bg-[#241913] hover:bg-[#332016] text-[#f2994a] font-semibold px-3 py-2 w-24 ring-1 ring-[#e07a2f]/35 transition" data-btn="KEY3">KEY3</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
